<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Verify Email | Professorkhujun</title>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-md border border-gray-100">
        <h2 class="text-3xl font-black text-center mb-2 text-gray-800">ইমেইল ভেরিফিকেশন</h2>
        <p class="text-center text-sm text-gray-500 mb-8">আপনার ইমেইলে পাঠানো ৬-ডিজিটের কোডটি লিখুন</p>

        {% if messages %}
            {% for message in messages %}
                <div class="bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm font-bold text-center border border-red-200">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <input type="text" name="otp" placeholder="Enter 6-digit OTP" required maxlength="6" class="w-full p-4 text-center tracking-widest text-xl font-bold bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 border border-gray-200">
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-blue-200">
                ভেরিফাই করুন
            </button>
        </form>
    </div>
</body>
</html>
