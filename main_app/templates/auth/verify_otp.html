<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Verify Email | Professorkhujun</title>
</head>
<body class="bg-[#FDF3EE] font-sans min-h-screen flex flex-col justify-center items-center p-2 sm:p-4">

    <!-- Main Card Container -->
    <div class="bg-[#FAFAFA] rounded-[2rem] shadow-2xl w-full max-w-md overflow-hidden border border-gray-100">
        
        <!-- Green Header -->
        <div class="bg-[#0A4D3C] py-3.5 px-6 text-center">
            <a href="/" class="text-2xl md:text-3xl font-black text-white tracking-wide transition hover:opacity-80 inline-block">
                Professorkhujun<span class="text-yellow-400">.com</span>
            </a>
        </div>

        <!-- Content Padding -->
        <div class="p-5 md:p-6">
            
            <!-- Title Section -->
            <div class="mb-5 text-left">
                <h2 class="text-2xl md:text-3xl font-black text-gray-900 mb-1 tracking-tight">OTP ভেরিফাই করুন</h2>
                <p class="text-xs md:text-sm text-gray-600 font-medium leading-relaxed">
                    আপনার ডেটা আমাদের কাছে নিরাপদ। আপনার ইমেইলে পাঠানো ৬-ডিজিটের কোডটি নিচে লিখুন।
                </p>
            </div>

            <!-- Error Messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="mb-4 bg-red-50 text-red-600 p-2.5 rounded-lg border border-red-100 font-bold text-center text-xs md:text-sm">
                        ⚠️ {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" class="space-y-5" id="otpForm">
                {% csrf_token %}
                
                <!-- Hidden input to send actual OTP to backend -->
                <input type="hidden" name="otp" id="final_otp" required>

                <!-- OTP Input Group Box -->
                <div class="border border-indigo-200 rounded-2xl p-4 bg-white shadow-sm relative">
                    <span class="absolute top-3 left-4 text-xs font-bold text-gray-800">OTP</span>
                    <div class="flex items-center justify-between mt-3">
                        <!-- Key Icon -->
                        <div class="text-orange-400 mr-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                            </svg>
                        </div>
                        
                        <!-- 6 Digit Inputs -->
                        <div class="flex gap-1.5 md:gap-2 w-full justify-end">
                            <input type="text" maxlength="1" class="otp-input w-9 h-11 md:w-11 md:h-12 text-center text-lg md:text-xl font-bold text-gray-800 bg-gray-50 border border-indigo-200 rounded-lg focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 outline-none transition-all">
                            <input type="text" maxlength="1" class="otp-input w-9 h-11 md:w-11 md:h-12 text-center text-lg md:text-xl font-bold text-gray-800 bg-gray-50 border border-indigo-200 rounded-lg focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 outline-none transition-all">
                            <input type="text" maxlength="1" class="otp-input w-9 h-11 md:w-11 md:h-12 text-center text-lg md:text-xl font-bold text-gray-800 bg-gray-50 border border-indigo-200 rounded-lg focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 outline-none transition-all">
                            <input type="text" maxlength="1" class="otp-input w-9 h-11 md:w-11 md:h-12 text-center text-lg md:text-xl font-bold text-gray-800 bg-gray-50 border border-indigo-200 rounded-lg focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 outline-none transition-all">
                            <input type="text" maxlength="1" class="otp-input w-9 h-11 md:w-11 md:h-12 text-center text-lg md:text-xl font-bold text-gray-800 bg-gray-50 border border-indigo-200 rounded-lg focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 outline-none transition-all">
                            <input type="text" maxlength="1" class="otp-input w-9 h-11 md:w-11 md:h-12 text-center text-lg md:text-xl font-bold text-gray-800 bg-gray-50 border border-indigo-200 rounded-lg focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 outline-none transition-all">
                        </div>
                    </div>
                </div>

                <!-- Resend OTP Section -->
                <div class="flex items-center gap-4 mt-2">
                    <button type="button" id="resend-btn" disabled class="bg-gray-200 text-gray-400 font-bold py-2.5 px-5 rounded-xl text-xs md:text-sm transition cursor-not-allowed">
                        Resend OTP
                    </button>
                    <span id="timer" class="text-sm font-bold text-gray-800">Resend in 1:42</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-[#f6a27e] hover:bg-[#e8916d] text-white font-bold py-3 md:py-4 rounded-2xl transition shadow-md flex justify-center items-center gap-2 mt-4">
                    <span class="text-base md:text-lg tracking-wide">Verify OTP</span>
                    <div class="bg-white text-[#f6a27e] w-6 h-6 md:w-7 md:h-7 rounded-full flex items-center justify-center shadow-sm">
                        <svg class="w-3 h-3 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </div>
                </button>
            </form>
        </div>
    </div>

    <!-- OTP & Timer JavaScript -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // OTP Input Logic
            const inputs = document.querySelectorAll('.otp-input');
            const hiddenOtp = document.getElementById('final_otp');

            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Only allow numbers
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    
                    if (e.target.value !== '' && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                    updateHiddenOtp();
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });

                // Handle Paste Event
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    let paste = (e.clipboardData || window.clipboardData).getData('text');
                    paste = paste.replace(/[^0-9]/g, '').substring(0, 6);
                    
                    for (let i = 0; i < paste.length; i++) {
                        if (i < inputs.length) {
                            inputs[i].value = paste[i];
                            if (i < inputs.length - 1) inputs[i + 1].focus();
                        }
                    }
                    updateHiddenOtp();
                });
            });

            function updateHiddenOtp() {
                let otpValue = '';
                inputs.forEach(input => {
                    otpValue += input.value;
                });
                hiddenOtp.value = otpValue;
            }

            // Timer Logic
            let timeLeft = 120; // 1 minute 42 seconds
            const timerElement = document.getElementById('timer');
            const resendBtn = document.getElementById('resend-btn');

            const countdown = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerElement.innerText = '';
                    resendBtn.disabled = false;
                    resendBtn.classList.remove('bg-gray-200', 'text-gray-400', 'cursor-not-allowed');
                    resendBtn.classList.add('bg-blue-100', 'text-blue-700', 'hover:bg-blue-200', 'cursor-pointer');
                    
                    resendBtn.onclick = function() {
    window.location.href = "{% url 'resend_otp' %}"; 
};
                } else {
                    let m = Math.floor(timeLeft / 60);
                    let s = timeLeft % 60;
                    timerElement.innerText = `Resend in ${m}:${s < 10 ? '0'+s : s}`;
                    timeLeft -= 1;
                }
            }, 1000);
        });
    </script>
</body>
</html>
