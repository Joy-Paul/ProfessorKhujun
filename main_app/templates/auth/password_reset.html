<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>পাসওয়ার্ড রিসেট | Professorkhujun</title>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col justify-center items-center p-4">

    <a href="/" class="text-3xl md:text-4xl font-black text-blue-900 tracking-tight mb-6 md:mb-8 mt-4 md:mt-0 transition hover:scale-105">
        Professorkhujun<span class="text-yellow-500">.com</span>
    </a>

    <div class="bg-white p-6 md:p-10 rounded-2xl md:rounded-3xl shadow-xl border border-gray-100 w-full max-w-md">
        <div class="text-center mb-6 md:mb-8">
            <div class="text-4xl mb-4">🔒</div>
            <h2 class="text-2xl md:text-3xl font-black text-gray-800 mb-1 md:mb-2">পাসওয়ার্ড ভুলে গেছেন?</h2>
            <p class="text-xs md:text-sm text-gray-500">আপনার অ্যাকাউন্টের ইমেইল ঠিকানাটি দিন। আমরা পাসওয়ার্ড রিসেট করার একটি লিংক পাঠিয়ে দেবো।</p>
        </div>

        <form method="POST" class="space-y-4 md:space-y-5">
            {% csrf_token %}
            
            <div class="space-y-4 [&>p>label]:hidden [&>p>input]:w-full [&>p>input]:p-3.5 [&>p>input]:md:p-4 [&>p>input]:bg-gray-50 [&>p>input]:rounded-xl [&>p>input]:md:rounded-2xl [&>p>input]:border [&>p>input]:border-gray-200 [&>p>input]:outline-none [&>p>input]:text-sm [&>p>input]:transition [&>p>input:focus]:ring-2 [&>p>input:focus]:ring-blue-500 [&>p>input:focus]:bg-white">
                {{ form.as_p }}
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 md:py-3.5 rounded-xl md:rounded-2xl transition shadow-md shadow-blue-200 text-sm md:text-base mt-2">
                রিসেট লিংক পাঠান
            </button>
        </form>

        <p class="text-center text-xs md:text-sm text-gray-600 mt-6 md:mt-8 font-medium">
            <a href="{% url 'login' %}" class="text-gray-500 font-bold hover:text-blue-600 transition flex items-center justify-center gap-1">
                <span>←</span> লগইন পেজে ফিরে যান
            </a>
        </p>
    </div>

</body>
</html>
