<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>পাসওয়ার্ড রিসেট | Professorkhujun</title>
</head>
<body class="bg-[#FDF3EE] font-sans min-h-screen flex flex-col justify-center items-center p-2 sm:p-4">

    <!-- Main Card Container -->
    <div class="bg-[#FAFAFA] rounded-[2rem] shadow-2xl w-full max-w-md overflow-hidden border border-gray-100">
        
        <!-- Green Header -->
        <div class="bg-[#0A4D3C] py-3.5 px-6 text-center">
            <a href="/" class="text-2xl md:text-3xl font-black text-white tracking-wide transition hover:opacity-80 inline-block">
                Professorkhujun<span class="text-yellow-400">.com</span>
            </a>
        </div>

        <!-- Content Padding -->
        <div class="p-5 md:p-6 text-center">
            
            <div class="mb-5">
                <div class="text-4xl mb-3">🔒</div>
                <h2 class="text-2xl md:text-3xl font-black text-gray-900 mb-1 tracking-tight">পাসওয়ার্ড ভুলে গেছেন?</h2>
                <p class="text-xs md:text-sm text-gray-600 font-medium">
                    আপনার অ্যাকাউন্টের ইমেইল ঠিকানাটি দিন। আমরা পাসওয়ার্ড রিসেট করার একটি লিংক পাঠিয়ে দেবো।
                </p>
            </div>

            <form method="POST" class="space-y-4">
                {% csrf_token %}
                
                <div class="text-left [&>p>label]:hidden [&>p>input]:w-full [&>p>input]:p-3.5 [&>p>input]:bg-white [&>p>input]:rounded-2xl [&>p>input]:border [&>p>input]:border-gray-200 [&>p>input]:outline-none [&>p>input]:text-sm [&>p>input]:md:text-base [&>p>input]:text-[#7BA69C] [&>p>input]:font-medium [&>p>input]:transition-all [&>p>input:focus]:ring-1 [&>p>input:focus]:ring-blue-500 [&>p>input:focus]:border-blue-500 shadow-sm">
                    {{ form.as_p }}
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 md:py-3.5 rounded-full transition shadow-md flex justify-center items-center relative mt-3">
                    <span class="text-base md:text-lg tracking-wide">রিসেট লিংক পাঠান</span>
                </button>
            </form>

            <!-- Login Link -->
            <div class="mt-4 pt-3 border-t border-gray-100 flex justify-center">
                <a href="{% url 'login' %}" class="text-gray-400 hover:text-gray-600 text-xs md:text-sm font-bold transition flex items-center gap-1">
                    <span>←</span> লগইন পেজে ফিরে যান
                </a>
            </div>
        </div>
    </div>

</body>
</html>
