<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>ইমেইল পাঠানো হয়েছে | Professorkhujun</title>
</head>
<body class="bg-[#FDF3EE] font-sans min-h-screen flex flex-col justify-center items-center p-2 sm:p-4">

    <!-- Main Card Container -->
    <div class="bg-[#FAFAFA] rounded-[2rem] shadow-2xl w-full max-w-md overflow-hidden border border-gray-100">
        
        <!-- Green Header -->
        <div class="bg-[#0A4D3C] py-3.5 px-6 text-center">
            <a href="/" class="text-2xl md:text-3xl font-black text-white tracking-wide transition hover:opacity-80 inline-block">
                Professorkhujun<span class="text-yellow-400">.com</span>
            </a>
        </div>

        <!-- Content Padding -->
        <div class="p-6 md:p-8 text-center">
            
            <!-- Animated Premium Icon -->
            <div class="relative w-20 h-20 mx-auto mb-6 md:mb-8 mt-2">
                <!-- Soft background pulse -->
                <div class="absolute inset-0 bg-green-100 rounded-full animate-pulse"></div>
                <!-- Main envelope icon -->
                <div class="absolute inset-0 flex items-center justify-center text-green-600">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <!-- Success Checkmark Badge -->
                <div class="absolute bottom-0 right-0 bg-white rounded-full p-1 shadow-sm">
                    <div class="bg-green-500 rounded-full w-6 h-6 flex items-center justify-center text-white">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <h2 class="text-2xl md:text-3xl font-black text-gray-900 mb-2 tracking-tight">ইমেইল পাঠানো হয়েছে!</h2>
            
            <p class="text-sm md:text-base text-gray-600 mb-6 font-medium leading-relaxed px-2">
                আমরা আপনার ইমেইলে পাসওয়ার্ড রিসেট করার একটি লিংক পাঠিয়েছি। অনুগ্রহ করে আপনার ইনবক্স চেক করুন।
            </p>

            <!-- Modern Alert Box -->
            <div class="bg-amber-50 text-amber-700 p-4 rounded-2xl text-xs md:text-sm font-medium border border-amber-100 mb-8 shadow-sm flex items-start gap-3 text-left">
                <svg class="w-5 h-5 shrink-0 mt-0.5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <p>লিংকটি পেতে কিছুক্ষণ সময় লাগতে পারে। ইনবক্সে না পেলে <span class="font-bold">Spam</span> বা <span class="font-bold">Junk</span> ফোল্ডার চেক করতে ভুলবেন না!</p>
            </div>

            <!-- Call to Action Button (Replacing the simple link) -->
            <a href="{% url 'login' %}" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 md:py-4 rounded-full transition shadow-md flex justify-center items-center gap-2 group">
                <span class="text-base tracking-wide">লগইন পেজে ফিরে যান</span>
                <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </a>
            
        </div>
    </div>

</body>
</html>
