<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>ইমেইল পাঠানো হয়েছে | Professorkhujun</title>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col justify-center items-center p-4">

    <a href="/" class="text-3xl md:text-4xl font-black text-blue-900 tracking-tight mb-6 md:mb-8 mt-4 md:mt-0 transition hover:scale-105">
        Professorkhujun<span class="text-yellow-500">.com</span>
    </a>

    <div class="bg-white p-6 md:p-10 rounded-2xl md:rounded-3xl shadow-xl border border-gray-100 w-full max-w-md text-center">
        <div class="text-5xl mb-4">📧</div>
        <h2 class="text-2xl md:text-3xl font-black text-gray-800 mb-2">ইমেইল পাঠানো হয়েছে!</h2>
        
        <p class="text-sm md:text-base text-gray-500 mb-6 leading-relaxed">
            আমরা আপনার ইমেইলে পাসওয়ার্ড রিসেট করার একটি লিংক পাঠিয়েছি। অনুগ্রহ করে আপনার ইনবক্স (এবং স্প্যাম ফোল্ডার) চেক করুন।
        </p>

        <div class="bg-blue-50 text-blue-800 p-4 rounded-xl text-xs md:text-sm font-bold border border-blue-100 mb-6">
            লিংকটি পেতে কিছুক্ষণ সময় লাগতে পারে।
        </div>

        <a href="{% url 'login' %}" class="inline-block w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 md:py-3.5 rounded-xl md:rounded-2xl transition text-sm md:text-base">
            লগইন পেজে ফিরে যান
        </a>
    </div>

</body>
</html>
