<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Sign Up | Professorkhujun</title>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col justify-center items-center p-4">

    <!-- লোগো / সাইট নেম -->
    <a href="/" class="text-3xl md:text-4xl font-black text-blue-900 tracking-tight mb-6 md:mb-8 mt-4 md:mt-0 transition hover:scale-105">
        Professorkhujun<span class="text-yellow-500">.com</span>
    </a>

    <!-- মূল সাইনআপ বক্স -->
    <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-md border border-gray-100">
        <h2 class="text-3xl font-black text-center mb-2 text-gray-800">অ্যাকাউন্ট তৈরি করুন</h2>
        <p class="text-center text-sm text-gray-500 mb-8">স্টুডেন্ট বা প্রফেসর হিসেবে যোগ দিন</p>

        {% if messages %}
            {% for message in messages %}
                <div class="bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm font-bold text-center border border-red-200">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'signup' %}" class="space-y-5">
            {% csrf_token %}
            
            <div class="flex gap-4 mb-4">
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="role" value="student" class="peer sr-only" checked>
                    <div class="text-center p-3 rounded-xl border-2 peer-checked:border-blue-600 peer-checked:bg-blue-50 font-bold text-gray-600 transition">
                        👨‍🎓 আমি স্টুডেন্ট
                    </div>
                </label>
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="role" value="professor" class="peer sr-only">
                    <div class="text-center p-3 rounded-xl border-2 peer-checked:border-yellow-500 peer-checked:bg-yellow-50 font-bold text-gray-600 transition">
                        👨‍🏫 আমি প্রফেসর
                    </div>
                </label>
            </div>

            <input type="text" name="username" placeholder="ইউজারনেম (Username)" required class="w-full p-4 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 border border-gray-200">
            
            <input type="email" name="email" placeholder="আপনার ইমেইল অ্যাড্রেস" required class="w-full p-4 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 border border-gray-200">
            
            <div class="relative">
                <input type="password" id="passwordField" name="password" placeholder="পাসওয়ার্ড" required class="w-full p-4 pr-12 bg-gray-50 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 border border-gray-200">
                
                <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-blue-600 transition">
                    <svg id="eyeShow" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    <svg id="eyeHide" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                    </svg>
                </button>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-blue-200">
                সাইন আপ করুন
            </button>
        </form>
        
        <p class="text-center text-sm text-gray-500 mt-6">
            আগে থেকেই অ্যাকাউন্ট আছে? <a href="{% url 'login' %}" class="text-blue-600 font-bold hover:underline">লগইন করুন</a>
        </p>
    </div>

    <!-- হোমপেজে ফিরে যাওয়ার লিংক -->
    <a href="/" class="mt-8 text-gray-400 hover:text-gray-600 text-xs md:text-sm font-bold transition flex items-center gap-1 mb-8 md:mb-0">
        <span>←</span> হোমপেজে ফিরে যান
    </a>

    <!-- পাসওয়ার্ড দেখার স্ক্রিপ্ট -->
    <script>
        function togglePassword() {
            const field = document.getElementById('passwordField');
            const showIcon = document.getElementById('eyeShow');
            const hideIcon = document.getElementById('eyeHide');
            
            if (field.type === 'password') {
                field.type = 'text';
                showIcon.classList.add('hidden');
                hideIcon.classList.remove('hidden');
            } else {
                field.type = 'password';
                showIcon.classList.remove('hidden');
                hideIcon.classList.add('hidden');
            }
        }
    </script>

</body>
</html>
