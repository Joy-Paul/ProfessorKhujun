<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>লগইন | Professorkhujun</title>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col justify-center items-center p-4">

    <a href="/" class="text-3xl md:text-4xl font-black text-blue-900 tracking-tight mb-6 md:mb-8 mt-4 md:mt-0 transition hover:scale-105">
        Professorkhujun<span class="text-yellow-500">.com</span>
    </a>

    <div class="bg-white p-6 md:p-10 rounded-2xl md:rounded-3xl shadow-xl border border-gray-100 w-full max-w-md">
        <div class="text-center mb-6 md:mb-8">
            <h2 class="text-2xl md:text-3xl font-black text-gray-800 mb-1 md:mb-2">স্বাগতম! 👋</h2>
            <p class="text-xs md:text-sm text-gray-500">আপনার অ্যাকাউন্টে লগইন করুন</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 bg-red-50 text-red-600 p-3 rounded-lg border border-red-100 font-bold text-center text-xs md:text-sm">
                    ⚠️ {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-4 md:space-y-5">
            {% csrf_token %}
            
            <div>
                <label class="block text-xs md:text-sm font-bold text-gray-700 mb-1.5 md:mb-2">ইউজারনেম</label>
                <input type="text" name="username" required class="w-full p-3.5 md:p-4 bg-gray-50 rounded-xl md:rounded-2xl border border-gray-200 outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-sm transition">
            </div>
            
            <div>
                <label class="block text-xs md:text-sm font-bold text-gray-700 mb-1.5 md:mb-2">পাসওয়ার্ড</label>
                <div class="relative">
                    <input type="password" id="passwordField" name="password" required class="w-full p-3.5 md:p-4 bg-gray-50 rounded-xl md:rounded-2xl border border-gray-200 outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-sm transition">
                    
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-blue-600 transition">
                        <svg id="eyeShow" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="eyeHide" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 md:py-3.5 rounded-xl md:rounded-2xl transition shadow-md shadow-blue-200 text-sm md:text-base mt-2">
                লগইন করুন
            </button>
            
            <div class="text-center mt-4">
                <a href="{% url 'password_reset' %}" class="text-xs md:text-sm font-bold text-gray-500 hover:text-blue-600 transition">পাসওয়ার্ড ভুলে গেছেন?</a>
            </div>
        </form>

        <p class="text-center text-xs md:text-sm text-gray-600 mt-8 font-medium">
            অ্যাকাউন্ট নেই? <a href="{% url 'signup' %}" class="text-blue-600 font-bold hover:underline">নতুন অ্যাকাউন্ট খুলুন</a>
        </p>
    </div>

    <a href="/" class="mt-8 text-gray-400 hover:text-gray-600 text-xs md:text-sm font-bold transition flex items-center gap-1">
        <span>←</span> হোমপেজে ফিরে যান
    </a>

    <script>
        function togglePassword() {
            const field = document.getElementById('passwordField');
            const showIcon = document.getElementById('eyeShow');
            const hideIcon = document.getElementById('eyeHide');
            
            if (field.type === 'password') {
                field.type = 'text';
                showIcon.classList.add('hidden');
                hideIcon.classList.remove('hidden');
            } else {
                field.type = 'password';
                showIcon.classList.remove('hidden');
                hideIcon.classList.add('hidden');
            }
        }
    </script>

</body>
</html>
