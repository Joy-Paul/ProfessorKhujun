<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>পাসওয়ার্ড পরিবর্তিত হয়েছে | Professorkhujun</title>
</head>
<body class="bg-[#FDF3EE] font-sans min-h-screen flex flex-col justify-center items-center p-2 sm:p-4">

    <!-- Main Card Container -->
    <div class="bg-[#FAFAFA] rounded-[2rem] shadow-2xl w-full max-w-md overflow-hidden border border-gray-100">
        
        <!-- Green Header -->
        <div class="bg-[#0A4D3C] py-3.5 px-6 text-center">
            <a href="/" class="text-2xl md:text-3xl font-black text-white tracking-wide transition hover:opacity-80 inline-block">
                Professorkhujun<span class="text-yellow-400">.com</span>
            </a>
        </div>

        <!-- Content Padding -->
        <div class="p-6 md:p-8 text-center">
            
            <div class="text-5xl mb-4">🎉</div>
            <h2 class="text-2xl md:text-3xl font-black text-gray-900 mb-2 tracking-tight">সফলভাবে পরিবর্তন হয়েছে!</h2>
            
            <p class="text-sm md:text-base text-gray-600 mb-6 font-medium leading-relaxed">
                আপনার অ্যাকাউন্টের পাসওয়ার্ড সফলভাবে আপডেট করা হয়েছে। এখন আপনি নতুন পাসওয়ার্ড ব্যবহার করে লগইন করতে পারবেন।
            </p>

            <a href="{% url 'login' %}" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 md:py-3.5 rounded-full transition shadow-md flex justify-center items-center relative">
                <span class="text-base md:text-lg tracking-wide">লগইন করুন</span>
                <div class="absolute right-2 bg-white text-blue-600 w-8 h-8 md:w-9 md:h-9 rounded-full flex items-center justify-center shadow-sm">
                    <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </div>
            </a>
            
        </div>
    </div>

</body>
</html>
